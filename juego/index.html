<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Hechizos de la Yaya</title>
<link rel="icon" href="assets/icono.png">
<style>
  @font-face { font-family: Bruja; src: url(assets/fuentes/HennyPenny-Regular.ttf); }
  @font-face { font-family: Fredoka; src: url(assets/fuentes/Fredoka.ttf); font-weight: 300 700; }
  :root {
    --k: 1.1;                                  /* tamaño de letra (se cambia en Ajustes) */
    --fondo: #2a1840; --panel: #3d2560; --panel2: #4f3178; --texto: #fff8ee; --suave: #e2cff7;
    --oro: #ffcf5a; --rojo: #e8445a; --verde: #3fbf7f; --morado: #b58cff;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html { font-size: calc(17px * var(--k)); }
  html, body { margin: 0; height: 100%; background: var(--fondo); color: var(--texto); overflow: hidden;
    font-family: Fredoka, system-ui, sans-serif; font-weight: 500; -webkit-user-select: none; user-select: none; touch-action: none; }
  button { font: inherit; color: inherit; border: 0; cursor: pointer; }
  .pantalla { position: fixed; inset: 0; display: none; flex-direction: column; }
  .pantalla.ver { display: flex; }
  .boton { background: var(--rojo); color: #fff; font-weight: 700; font-size: 1.35rem; padding: .6em 1.4em; border-radius: 1em;
    box-shadow: 0 .25rem 0 #9e2236; min-height: 3rem; }
  .boton:active { transform: translateY(.15rem); box-shadow: 0 .1rem 0 #9e2236; }
  .boton.morado { background: #7b4fc9; box-shadow: 0 .25rem 0 #4b2a86; }
  .boton.verde { background: var(--verde); box-shadow: 0 .25rem 0 #23784e; }
  .boton.gris { background: #6d5a85; box-shadow: 0 .25rem 0 #45365a; }
  .redondo { width: 3rem; height: 3rem; border-radius: 50%; background: var(--panel2); font-size: 1.4rem; display: grid; place-items: center; flex: none; }
  .titulo { font-family: Bruja, serif; color: #e4c6ff; text-shadow: 0 .2rem 0 #3a1d63, 0 0 1rem #9b6bff88; line-height: 1.05; }

  /* Portada */
  #portada { align-items: center; justify-content: space-between; text-align: center; padding: 2.2rem 1rem 2rem;
    background: radial-gradient(circle at 50% 30%, #5a3590, #2a1840 70%); background-size: cover; background-position: center bottom; }
  #portada .titulo { font-size: 3.1rem; margin-top: .5rem; }
  #portada .para { font-size: 1.2rem; color: var(--suave); margin-top: .4rem; text-shadow: 0 2px 4px #000a; }
  #portada .decor { font-size: 4.5rem; letter-spacing: .3rem; }
  #portada .botones { display: flex; flex-direction: column; gap: .9rem; align-items: center; }

  /* Mapa */
  .barra { display: flex; align-items: center; gap: .6rem; padding: .6rem .8rem; background: #1f1130dd; flex: none; z-index: 2; }
  .barra .nombre { flex: 1; font-weight: 700; font-size: 1.3rem; text-align: center; }
  .pociones { white-space: nowrap; display: flex; align-items: center; gap: .3rem; background: var(--panel2); border-radius: 1.5rem; padding: .3rem .8rem; font-weight: 700; font-size: 1.2rem; }
  .pociones small { font-weight: 500; font-size: .8rem; color: var(--suave); }
  .pociones img, .icono { width: 1.7rem; height: 1.7rem; object-fit: contain; vertical-align: middle; }
  #scroll { flex: 1; overflow-y: auto; touch-action: pan-y; position: relative;
    background: linear-gradient(#1c3a2e, #24203f 30%, #2c1d47 60%, #1c3a2e); }
  #camino { position: relative; width: 100%; }
  #camino svg { position: absolute; inset: 0; width: 100%; height: 100%; }
  .deco { position: absolute; font-size: 2.2rem; opacity: .8; pointer-events: none; }
  .nodo { position: absolute; width: 3.8rem; height: 3.8rem; margin: -1.9rem 0 0 -1.9rem; border-radius: 50%;
    background: radial-gradient(circle at 35% 30%, #ffb3c0, var(--rojo)); box-shadow: 0 .3rem 0 #9e2236, 0 0 0 .2rem #fff6;
    font-weight: 700; font-size: 1.5rem; display: grid; place-items: center; }
  .nodo.hecho { background: radial-gradient(circle at 35% 30%, #c9a6ff, #7b4fc9); box-shadow: 0 .3rem 0 #4b2a86, 0 0 0 .2rem #fff6; }
  .nodo.cerrado { background: #5a4d6b; box-shadow: 0 .3rem 0 #3a3147; color: #b9adc8; font-size: 1.2rem; }
  .nodo.actual { animation: latido 1.2s ease-in-out infinite; }
  .nodo .estrellas { position: absolute; top: 100%; margin-top: .35rem; font-size: .95rem; white-space: nowrap; letter-spacing: -.05em; }
  .nodo .marca { position: absolute; bottom: 100%; font-size: 2rem; margin-bottom: -.2rem; }
  @keyframes latido { 50% { transform: scale(1.12); } }
  .on { color: var(--oro); text-shadow: 0 1px 2px #000; } .off { color: #ffffff40; }

  /* Juego */
  #juego { background: #2a1840; background-size: cover; background-position: center; }
  .hud { display: flex; gap: .6rem; padding: .5rem .8rem 0; flex: none; }
  .caja { background: #1f1130cc; border-radius: 1rem; padding: .4rem .7rem; text-align: center; }
  .mov { min-width: 5.5rem; }
  .mov b { display: block; font-size: 2.2rem; line-height: 1; color: var(--oro); }
  .mov span, .obj span.et { font-size: .85rem; color: var(--suave); }
  .obj { flex: 1; display: flex; flex-direction: column; justify-content: center; }
  .metas { display: flex; flex-wrap: wrap; gap: .3rem .9rem; justify-content: center; align-items: center; }
  .meta { display: flex; align-items: center; gap: .3rem; font-weight: 700; font-size: 1.45rem; }
  .meta .icono { width: 2.1rem; height: 2.1rem; }
  .meta.hecha { color: var(--verde); }
  .mision { margin: .45rem .8rem 0; padding: .35rem .7rem; border-radius: .8rem; background: #1f1130aa; font-size: 1rem; text-align: center; flex: none; }
  .mision.hecha { background: #23784ecc; }
  #tablero { flex: 1; display: grid; place-items: center; padding: .5rem; min-height: 0; }
  #lienzo { touch-action: none; display: block; }
  .pie { display: flex; gap: .7rem; padding: 0 .8rem .9rem; justify-content: center; flex: none; }
  .pie .boton { font-size: 1.15rem; padding: .5em 1em; display: flex; align-items: center; gap: .4rem; }
  .pie .boton img { width: 1.6rem; height: 1.6rem; }

  /* Ventanas */
  #velo { position: fixed; inset: 0; background: #0d0616bb; display: none; align-items: center; justify-content: center; padding: 1rem; z-index: 10; }
  #velo.ver { display: flex; }
  .ventana { background: linear-gradient(#4a2d72, #34204f); border: .2rem solid #9b75d6; border-radius: 1.4rem; padding: 1.2rem 1.1rem;
    width: 100%; max-width: 30rem; max-height: 92vh; overflow-y: auto; text-align: center; box-shadow: 0 1rem 3rem #000a; animation: sale .25s ease-out; touch-action: pan-y; }
  @keyframes sale { from { transform: scale(.8); opacity: 0; } }
  .ventana h2 { margin: .1rem 0 .6rem; font-size: 2.1rem; font-weight: 400; }
  .ventana p { font-size: 1.2rem; margin: .5rem 0; line-height: 1.35; }
  .ventana .fila { display: flex; gap: .6rem; justify-content: center; flex-wrap: wrap; margin-top: 1rem; }
  .ventana .lista { text-align: left; font-size: 1.15rem; line-height: 1.4; padding: 0; list-style: none; }
  .ventana .lista li { display: flex; gap: .6rem; align-items: center; margin: .5rem 0; }
  .ventana .lista .icono { width: 2.2rem; height: 2.2rem; flex: none; }
  .grandes { font-size: 2.8rem; letter-spacing: .3rem; margin: .3rem 0; }
  .opcion { background: var(--panel2); border-radius: .9rem; padding: .5rem .9rem; font-weight: 700; min-height: 3rem; }
  .opcion.elegida { background: var(--oro); color: #3a2400; }
  .ajuste { margin: 1rem 0; }
  .ajuste > div:first-child { font-size: 1.2rem; margin-bottom: .45rem; color: var(--suave); }
  .aviso { position: fixed; left: 50%; top: 40%; transform: translate(-50%, -50%); pointer-events: none; z-index: 5;
    font-family: Bruja, serif; font-size: 2.8rem; color: #fff1b0; text-shadow: 0 .2rem 0 #7b4fc9, 0 0 1rem #000; white-space: nowrap; animation: aviso 1.1s ease-out forwards; }
  @keyframes aviso { 0% { transform: translate(-50%, -50%) scale(.4); opacity: 0; } 20% { transform: translate(-50%, -50%) scale(1.1); opacity: 1; }
    75% { opacity: 1; } 100% { transform: translate(-50%, -80%) scale(1); opacity: 0; } }
  /* ===== Dibujos de Gemini para menús y botones ===== */
  .boton { background: none; box-shadow: none; border-style: solid; border-width: 0 2.1rem; padding: .55em .15em;
    border-image: url(assets/ui/rojo.png) 0 30% fill / 0 2.1rem stretch; text-shadow: 0 .12rem 0 #0007; white-space: nowrap; }
  .boton:active { transform: translateY(.12rem); box-shadow: none; filter: brightness(.92); }
  .boton.morado { border-image-source: url(assets/ui/morado.png); box-shadow: none; }
  .boton.verde { border-image-source: url(assets/ui/verde.png); box-shadow: none; }
  .boton.gris { border-image-source: url(assets/ui/gris.png); box-shadow: none; }
  .redondo { background: url(assets/ui/redondo.png) center / contain no-repeat; text-shadow: 0 .1rem 0 #0006; }
  .redondo:active { filter: brightness(.9); }
  .opcion { background: none; border-style: solid; border-width: 0 1.3rem; padding: .35rem .1rem; color: #fff; text-shadow: 0 .1rem 0 #0007;
    border-image: url(assets/ui/gris.png) 0 30% fill / 0 1.3rem stretch; }
  .opcion.elegida { background: none; color: #fff; border-image-source: url(assets/ui/verde.png); }
  .ventana { background: none; border-style: solid; border-width: 112px 46px 58px; border-radius: 0; box-shadow: none; padding: 0 .2rem .3rem;
    border-image: url(assets/ui/pergamino.png) 145 60 75 fill / 112px 46px 58px stretch; color: #4a2b12; filter: drop-shadow(0 .8rem 1.5rem #000b); }
  .ventana h2.titulo { color: #6b3fa0; text-shadow: 0 .12rem 0 #f6e2b8, 0 0 .6rem #fff8; margin-top: .9rem; }
  .ventana p, .ventana .lista { color: #4a2b12; }
  .ventana .ajuste > div:first-child { color: #7a5230; }
  .ventana .off { color: #4a2b1240; }
  .caja { background: none; border-style: solid; border-width: .95rem 1.05rem; border-radius: 0; padding: 0 .2rem;
    border-image: url(assets/ui/cartel.png) 62 70 fill / .95rem 1.05rem stretch; }
  .mision { background: none; border-style: solid; border-width: .7rem .9rem; border-radius: 0; padding: 0 .2rem;
    border-image: url(assets/ui/cartel.png) 62 70 fill / .7rem .9rem stretch; }
  .mision.hecha { background: none; filter: hue-rotate(70deg) saturate(1.2); }
  #marco { border-style: solid; border-image: url(assets/ui/marco.png) 100 / 1 / 0 stretch; line-height: 0; }
  .ventana .boton { white-space: normal; max-width: 100%; font-size: 1.2rem; }
  .pie .boton { border-width: 0 1.5rem; border-image-width: 0 1.5rem; font-size: 1.1rem; padding: .45em .1em; }
  .prueba * { animation: none !important; }
  .brilla { animation: brilla .6s ease-out; }
  @keyframes brilla { 30% { transform: scale(1.35); color: #7dffb5; } }
</style>
</head>
<body>

<section id="portada" class="pantalla">
  <div>
    <div class="titulo">Hechizos<br>de la Yaya</div>
    <div class="para">Para la yaya Ana 💜</div>
  </div>
  <div class="decor" id="decorPortada">🍎🧙‍♀️🌙</div>
  <div class="botones">
    <button class="boton" id="bJugar">¡Jugar!</button>
    <button class="boton morado" id="bAjustesPortada">⚙️ Ajustes</button>
  </div>
</section>

<section id="mapa" class="pantalla">
  <div class="barra">
    <button class="redondo" id="bMapaAtras">⬅</button>
    <div class="nombre">Bosque encantado</div>
    <div class="pociones" id="pocMapa"></div>
    <button class="redondo" id="bAjustesMapa">⚙️</button>
  </div>
  <div id="scroll"><div id="camino"></div></div>
</section>

<section id="juego" class="pantalla">
  <div class="barra">
    <button class="redondo" id="bJuegoAtras">⬅</button>
    <div class="nombre" id="nombreNivel">Nivel 1</div>
    <button class="redondo" id="bAjustesJuego">⚙️</button>
  </div>
  <div class="hud">
    <div class="caja mov"><span>Movimientos</span><b id="movs">20</b></div>
    <div class="caja obj"><span class="et">Objetivo</span><div class="metas" id="metas"></div></div>
  </div>
  <div class="mision" id="mision"></div>
  <div id="tablero"><div id="marco"><canvas id="lienzo"></canvas></div></div>
  <div class="pie">
    <button class="boton morado" id="bPocion"></button>
    <button class="boton gris" id="bPista">💡 Pista</button>
  </div>
</section>

<div id="velo"><div class="ventana" id="ventana"></div></div>

<script src="motor.js"></script>
<script src="sonido.js"></script>
<script src="juego.js"></script>
</body>
</html>
